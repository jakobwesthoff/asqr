# Runs the same validation pipeline as the pre-commit hook (ADR 11), on
# both platforms asqr supports (spec section 1).
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: just check
