# Runs the same validation pipeline as the pre-commit hook (ADR 11), on
# both platforms asqr supports (spec section 1).
#
# Actions are pinned to full commit SHAs, since tags can be moved;
# Dependabot keeps the pins and their version comments current.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run
# pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, so the token does not need to stay
          # in .git/config where later steps could read it.
          persist-credentials: false
      # rust-toolchain has no release tags; the SHA is the head of its
      # `stable` branch, and a SHA pin needs the toolchain named explicitly.
      # Dependabot cannot follow a branch, so this pin is bumped by hand.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just,cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just check
      # Coverage stays out of the pre-commit hook (ADR 11), so CI is where it
      # is measured on every push.
      - run: just coverage

  # The release builds the statically linked Linux binaries against musl,
  # and libwebp (C, built by the build script of `libwebp-sys`) needs a
  # musl C compiler for each target. Each target builds on a runner of its
  # own architecture, so the compiler is the host's.
  musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: sudo apt-get install --yes musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--locked` builds the dependency versions the release builds.
      - run: cargo build --locked --target ${{ matrix.target }}
