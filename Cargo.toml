[package]
name = "asqr"
version = "0.11.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"
description = "Answer questions an AI agent or a script prepared for you, right in your terminal"
repository = "https://github.com/jakobwesthoff/asqr"
readme = "README.md"
keywords = ["tui", "terminal", "agent", "questions", "cli"]
categories = ["command-line-utilities"]
# The mascot's originals, docs, todos and repository tooling are not needed
# to build asqr. Talqi's templates, which scripts/emblem-cells.py makes from
# assets/emblem/, are under src/tui/render/mascot/.
exclude = ["assets/", "docs/", "todos/", ".adr-dir", ".github/", ".githooks/", "Justfile", "scripts/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
gethostname = "1.1.0"
image = "0.25.10"
jiff = "0.2.37"
notify-debouncer-full = "0.7.0"
patine = { version = "1.7.2", default-features = false }
ratatui = "0.30.2"
# Pinned exactly, as cargo picks a pre-release only when it is named. The
# default features stay off: they include `chafa-dyn`, which needs
# pkg-config and a system libchafa to build.
ratatui-image = { version = "=12.0.0-rc.2", default-features = false, features = ["crossterm", "image-defaults"] }
ratatui-textarea = "0.9.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ulid = "3.0.0"
unicode-segmentation = "1.13.3"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
portable-pty = "0.9.0"
vt100 = "0.16.2"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", features = ["event", "fs"] }
signal-hook = "0.3.18"
