[package]
name = "asqr"
version = "0.15.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"
description = "Answer questions an AI agent or a script prepared for you, right in your terminal"
repository = "https://github.com/jakobwesthoff/asqr"
readme = "README.md"
keywords = ["tui", "coding-agents", "claude-code", "human-in-the-loop", "questionnaire"]
categories = ["command-line-utilities", "development-tools"]
# The mascot's originals, docs, todos and repository tooling are not needed
# to build asqr. Talqi's templates, which scripts/emblem-cells.py makes from
# assets/emblem/, are under src/tui/render/mascot/.
exclude = ["assets/", "docs/", "todos/", ".adr-dir", ".github/", ".githooks/", "Justfile", "scripts/", "tools/"]

# The development tools of the repository (ADR 89). asqr stays one crate;
# the members are not published. Without `default-members`, a plain
# `cargo build` builds asqr alone, so the Justfile names the workspace.
[workspace]
members = ["tools/screens"]

[dependencies]
anstyle-parse = "1.0.0"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
edit = { version = "0.1.5", features = ["quoted-env"] }
# Compresses the old logs as gzip (ADR 91). The default backend is pure Rust.
flate2 = "1.1.10"
gethostname = "1.1.0"
image = "0.25.10"
jiff = "0.2.37"
# libwebp 1.6.0, built from C source that ships in the crate (ADR 100), so a
# build needs a C compiler. It encodes the images asqr keeps as WebP. The
# bindings are pre-generated: `generate-bindings` would need libclang.
libwebp-sys = { version = "0.14.4", default-features = false, features = ["std"] }
notify-debouncer-full = "0.7.0"
patine = { version = "1.9.0", default-features = false }
ratatui = "0.30.2"
# Pinned exactly, as cargo picks a pre-release only when it is named. The
# default features stay off: they include `chafa-dyn`, which needs
# pkg-config and a system libchafa to build.
ratatui-image = { version = "=12.0.0-rc.3", default-features = false, features = ["crossterm", "image-defaults"] }
ratatui-textarea = "0.9.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml_edit = "0.25.17"
tracing = "0.1.44"
# `env-filter` reads the filter in `ASQR_LOG` (ADR 83); it brings in
# `matchers`.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The syntaxes patine highlights with, which give the files `o` writes for
# inline code their extension. The version and features are patine's, so
# no other crate comes in: the default features would bring in Oniguruma,
# a C library.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }
ulid = "3.0.0"
unicode-segmentation = "1.13.3"
# Reads and writes the month bundles of the archive. Deflate goes through
# `flate2` and its pure-Rust backend; the default features would bring in
# bzip2, zstd, lzma and aes.
zip = { version = "9.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
portable-pty = "0.9.0"
vt100 = "0.18.1"

[target."cfg(unix)".dependencies]
# `process` gives the user's id, which names the directory `o` writes into,
# and lets the tests of the system's opener ask for a process's group and
# whether a finished one is still in the process table.
rustix = { version = "1.1.5", features = ["event", "fs", "process", "termios"] }
signal-hook = "0.4.5"
