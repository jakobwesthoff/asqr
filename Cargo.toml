[package]
name = "asqr"
version = "0.10.1"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"
description = "Answer questions an AI agent or a script prepared for you, right in your terminal"
repository = "https://github.com/jakobwesthoff/asqr"
readme = "README.md"
keywords = ["tui", "terminal", "agent", "questions", "cli"]
categories = ["command-line-utilities"]
# The logo, docs, todos and repository tooling are not needed to build asqr.
exclude = ["assets/", "docs/", "todos/", ".adr-dir", ".github/", ".githooks/", "Justfile", "scripts/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
gethostname = "1.1.0"
image = "0.25.10"
jiff = "0.2.37"
notify-debouncer-full = "0.7.0"
patine = { version = "1.5", default-features = false }
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
# Pinned exactly: `size_kitty_placement` in src/tui/render/images.rs edits
# the Kitty command this version writes. Unpin when that workaround goes.
ratatui-image = { version = "=11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
ratatui-textarea = "0.9.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = { version = "3.2.0", features = ["inline", "unicode"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ulid = "3.0.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
portable-pty = "0.9.0"
vt100 = "0.16.2"
