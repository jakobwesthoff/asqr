[package]
name = "asqr"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
gethostname = "1.1.0"
image = "0.25"
jiff = "0.2.37"
notify-debouncer-full = "0.7.0"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
ratatui-textarea = "0.9.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ulid = "3.0.0"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
