[package]
name = "screens"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"
description = "Draws asqr's screens with asqr's own code into PNG pictures for the documentation"
# A development tool of the repository (ADR 89), run with `just screens`.
publish = false

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
# The path alone, so a new version of asqr needs no change here.
asqr = { path = "../.." }
clap = { version = "4.6.7", features = ["derive"] }
image = "0.25.10"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
proc-macro2 = "1.0.107"
ratatui = "0.30.2"
syn = { version = "2.0.119", features = ["full", "visit"] }
tempfile = "3.27.0"
ttf-parser = "0.25"
